name: Research recorder

# Daily snapshot of the dashboard's computed numbers (scripts/research/record.ts) into research/data/,
# committed to main so the series is versioned. Cost: ~1 runner-minute a day on a free GitHub plan's
# included minutes; the timeout caps a stuck run. ACLED credentials come from repository secrets
# (Settings → Secrets and variables → Actions: ACLED_EMAIL, ACLED_PASSWORD) — never from the repo.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/research/record.ts
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
      - name: Commit snapshot
        run: |
          git config user.name 'research-recorder'
          git config user.email 'research-recorder@users.noreply.github.com'
          git add research/data
          git diff --cached --quiet && exit 0
          git commit -m "research: daily snapshot $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
